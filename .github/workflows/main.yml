name: Build & Release UnicodeFontSet Module

on:
  push:
    branches:
      - main
    tags:
      - '[vV]*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MODULE_DIR: module
  MODULE_PROP: module/module.prop
  MODULE_BIN_DIR: module/bin
  FONT_DIR: module/system/fonts
  UPDATE_BIN: module/META-INF/com/google/android/update-binary
  BUILD_DIR: build
  CLEANER_DIR: tools/font-cmap-cleaner
  RUST_VERSION: 1.97.1
  CARGO_NDK_VERSION: 4.1.2
  UPX_VERSION: 5.1.1
  NDK_VERSION: 29.0.14206865
  MAGISK_INSTALLER_COMMIT: ede844bdaa4d673617c0f14a991a79542c95967c

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy

      - name: Rust formatting
        run: cargo fmt --all -- --check

      - name: Rust check
        run: cargo check --workspace --all-targets --locked

      - name: Rust tests
        run: cargo test --workspace --all-targets --locked

      - name: Rust Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Shell syntax
        run: |
          set -euo pipefail
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(find module tests/shell -type f -name '*.sh' -print0)

      - name: Shell runtime tests
        run: |
          set -euo pipefail
          for test_script in tests/shell/*_test.sh; do
            bash "$test_script"
          done
          if command -v busybox >/dev/null 2>&1; then
            for test_script in tests/shell/*_test.sh; do
              busybox ash "$test_script"
            done
          fi

      - name: Python static checks
        run: |
          python3 -m compileall -q tools/python
          python3 tools/python/validate_repository.py

  build:
    name: Build ZIP Artifact — ${{ matrix.variant.suffix }}
    needs: quality
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant:
          - name: colrv1
            label: COLRv1
            emoji_url: https://github.com/googlefonts/noto-emoji/raw/main/fonts/Noto-COLRv1.ttf
            zip_name: UnicodeFontSet-COLRv1-module.zip
            suffix: COLRv1 (API >= 33)
            update_json: https://github.com/Losketch/UnicodeFontSet-magisk-module/raw/main/update-colrv1.json
            update_json_nightly: https://github.com/Losketch/UnicodeFontSet-magisk-module/releases/download/nightly/update-nightly-colrv1.json
          - name: cbdt
            label: CBDT
            emoji_url: https://github.com/googlefonts/noto-emoji/raw/main/fonts/NotoColorEmoji.ttf
            zip_name: UnicodeFontSet-CBDT-module.zip
            suffix: CBDT (API >= 19)
            update_json: https://github.com/Losketch/UnicodeFontSet-magisk-module/raw/main/update-cbdt.json
            update_json_nightly: https://github.com/Losketch/UnicodeFontSet-magisk-module/releases/download/nightly/update-nightly-cbdt.json

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Create build directories
        run: |
          mkdir -p \
            "${{ env.FONT_DIR }}" \
            "${{ env.MODULE_BIN_DIR }}" \
            "${{ env.BUILD_DIR }}" \
            "$(dirname "${{ env.UPDATE_BIN }}")"

      - name: Download required fonts and installer
        run: |
          set -euo pipefail
          tmp_dir=$(mktemp -d)
          trap 'rm -rf "$tmp_dir"' EXIT

          css_file="$tmp_dir/fonts.css"
          font_file="$tmp_dir/NotoEmoji-Regular.ttf"

          curl --fail --silent --show-error --location --retry 3 \
            -H "User-Agent: Mozilla/5.0" \
            "https://fonts.googleapis.com/css2?family=Noto+Emoji" \
            -o "$css_file"

          font_url=$(grep -o 'https://[^)]*\.ttf' "$css_file" | head -n 1)
          if [ -z "$font_url" ]; then
            echo "Failed to extract Noto Emoji TTF URL from Google Fonts CSS" >&2
            exit 1
          fi

          curl --fail --silent --show-error --location --retry 3 \
            "$font_url" -o "$font_file"
          cp "$font_file" "${{ env.FONT_DIR }}/NotoEmoji-Regular.ttf"

          declare -A files=(
            [NotoColorEmoji.ttf]="${{ matrix.variant.emoji_url }}"
            [SourceHanSansSC-Regular.otf]="https://github.com/adobe-fonts/source-han-sans/raw/release/OTF/SimplifiedChinese/SourceHanSansSC-Regular.otf"
            [NotoUnicode.otf]="https://github.com/MY1L/Unicode/releases/download/NotoUni7/NotoUnicode-7.3.otf"
            [NewGardiner.ttf]="https://github.com/Mercury13/unicodia/raw/main/Fonts/NewGardiner.ttf"
            [UnicodiaDaarage.otf]="https://github.com/Mercury13/unicodia/raw/main/Fonts/UnicodiaDaarage.otf"
            [UnicodiaSesh.ttf]="https://github.com/Mercury13/unicodia/raw/main/Fonts/UnicodiaSesh.ttf"
            [PlangothicP1-Regular.otf]="https://github.com/Fitzgerald-Porthmouth-Koenigsegg/Plangothic_Project/raw/build/fonts/otf/PlangothicP1-Regular.otf"
            [PlangothicP2-Regular.otf]="https://github.com/Fitzgerald-Porthmouth-Koenigsegg/Plangothic_Project/raw/build/fonts/otf/PlangothicP2-Regular.otf"
            [KreativeSquare.ttf]="https://github.com/kreativekorp/open-relay/raw/master/KreativeSquare/KreativeSquare.ttf"
            [TempSeal.ttf]="https://github.com/Losketch/Fonts/releases/download/TempSeal/TempSeal.ttf"
            [LastResort-Regular.ttf]="https://github.com/unicode-org/last-resort-font/releases/latest/download/LastResort-Regular.ttf"
          )

          for name in "${!files[@]}"; do
            echo "Downloading $name"
            curl --fail --silent --show-error --location --retry 3 \
              "${files[$name]}" -o "${{ env.FONT_DIR }}/$name"
          done

          curl --fail --silent --show-error --location --retry 3 \
            "https://raw.githubusercontent.com/topjohnwu/Magisk/${{ env.MAGISK_INSTALLER_COMMIT }}/scripts/module_installer.sh" \
            -o "${{ env.UPDATE_BIN }}"
          chmod 755 "${{ env.UPDATE_BIN }}"

      - name: Update module metadata for variant
        run: |
          sed -i \
            "s|^updateJson=.*|updateJson=${{ matrix.variant.update_json }}|" \
            "${{ env.MODULE_PROP }}"

      - name: Update version for nightly build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          version_date=$(date +%Y%m%d)
          build_num=${{ github.run_number }}
          awk \
            -v date="$version_date" \
            -v num="$build_num" \
            -v sha="${GITHUB_SHA:0:7}" \
            -v variant="${{ matrix.variant.label }}" '
              /^version=/ {
                sub(/^version=/, "")
                print "version=" $0 "." date "." num " [" sha "-Nightly-" variant "]"
                next
              }
              /^versionCode=/ { print "versionCode=" date num; next }
              { print }
            ' "${{ env.MODULE_PROP }}" > "${{ env.MODULE_PROP }}.tmp"
          mv "${{ env.MODULE_PROP }}.tmp" "${{ env.MODULE_PROP }}"
          sed -i \
            "s|^updateJson=.*|updateJson=${{ matrix.variant.update_json_nightly }}|" \
            "${{ env.MODULE_PROP }}"

      - name: Update version for release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version_date=$(date +%Y%m%d)
          build_num=${{ github.run_number }}
          awk \
            -v date="$version_date" \
            -v num="$build_num" \
            -v variant="${{ matrix.variant.label }}" '
              /^version=/ {
                sub(/^version=/, "")
                print "version=" $0 "." date "." num " [" variant "]"
                next
              }
              /^versionCode=/ { print "versionCode=" date num; next }
              { print }
            ' "${{ env.MODULE_PROP }}" > "${{ env.MODULE_PROP }}.tmp"
          mv "${{ env.MODULE_PROP }}.tmp" "${{ env.MODULE_PROP }}"

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache Cargo build data
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version "${{ env.CARGO_NDK_VERSION }}" --locked

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4.0.1

      - name: Cache Android NDK
        uses: actions/cache@v6.1.0
        with:
          path: ${{ env.ANDROID_SDK_ROOT }}/ndk/${{ env.NDK_VERSION }}
          key: android-ndk-${{ env.NDK_VERSION }}

      - name: Install Android NDK
        run: |
          sdkmanager \
            "ndk;${{ env.NDK_VERSION }}" \
            "build-tools;34.0.0" \
            "platforms;android-34"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/${{ env.NDK_VERSION }}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/${{ env.NDK_VERSION }}" >> "$GITHUB_ENV"

      - name: Add Rust Android targets
        run: |
          rustup target add \
            aarch64-linux-android \
            armv7-linux-androideabi \
            i686-linux-android \
            x86_64-linux-android

      - name: Cache UPX
        uses: actions/cache@v6.1.0
        with:
          path: /tmp/upx-${{ env.UPX_VERSION }}-amd64_linux
          key: upx-${{ env.UPX_VERSION }}

      - name: Install UPX
        run: |
          if ! command -v upx >/dev/null; then
            cd /tmp
            curl --fail --silent --show-error --location --retry 3 \
              "https://github.com/upx/upx/releases/download/v${{ env.UPX_VERSION }}/upx-${{ env.UPX_VERSION }}-amd64_linux.tar.xz" \
              -o upx.tar.xz
            tar -xf upx.tar.xz
            sudo install -m 0755 \
              "upx-${{ env.UPX_VERSION }}-amd64_linux/upx" \
              /usr/local/bin/upx
          fi
          upx --version

      - name: Build font-cmap-tool for Android
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target"

          cargo ndk \
            -t arm64-v8a \
            -t armeabi-v7a \
            -t x86 \
            -t x86_64 \
            build \
            --manifest-path "${{ env.CLEANER_DIR }}/Cargo.toml" \
            --package font-cmap-tool \
            --release \
            --locked

          declare -A targets=(
            [aarch64-linux-android]=arm64-v8a
            [armv7-linux-androideabi]=armeabi-v7a
            [i686-linux-android]=x86
            [x86_64-linux-android]=x86_64
          )

          for target in "${!targets[@]}"; do
            bin="$CARGO_TARGET_DIR/$target/release/font-cmap-tool"
            out="${{ env.MODULE_BIN_DIR }}/font-cmap-tool-${targets[$target]}"
            test -x "$bin"
            upx --best --lzma "$bin" || true
            install -m 0755 "$bin" "$out"
          done

      - name: Copy runtime configuration
        run: |
          test -s "${{ env.CLEANER_DIR }}/whitelist.txt"
          cp "${{ env.CLEANER_DIR }}/whitelist.txt" "${{ env.MODULE_DIR }}/config/whitelist.txt"
          cp LICENSE "${{ env.MODULE_DIR }}/LICENSE"
          cp README.md "${{ env.MODULE_DIR }}/README.md"
          cp README.en.md "${{ env.MODULE_DIR }}/README.en.md"

      - name: Validate built module assets
        run: python3 tools/python/validate_module.py --module "${{ env.MODULE_DIR }}"

      - name: Package module
        run: |
          set -euo pipefail
          (
            cd "${{ env.MODULE_DIR }}"
            zip -9 -r "../${{ matrix.variant.zip_name }}" .
          )
          unzip -t "${{ matrix.variant.zip_name }}"
          mv "${{ matrix.variant.zip_name }}" "${{ env.BUILD_DIR }}/"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: module-artifacts-${{ matrix.variant.name }}
          path: ${{ env.BUILD_DIR }}
          if-no-files-found: error

  release:
    name: 正式 Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download COLRv1 artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: module-artifacts-colrv1
          path: ./artifacts

      - name: Download CBDT artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: module-artifacts-cbdt
          path: ./artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3.0.2
        with:
          tag_name: ${{ github.ref_name }}
          name: UFS-Magisk ${{ github.ref_name }}
          files: ./artifacts/*.zip
          draft: false
          prerelease: false

  nightly:
    name: Nightly Release
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Download COLRv1 artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: module-artifacts-colrv1
          path: ./artifacts

      - name: Download CBDT artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: module-artifacts-cbdt
          path: ./artifacts

      - name: Get commits since last release
        id: commits
        run: |
          last_tag=$(git describe --tags --abbrev=0 --exclude='*nightly*' --match='[vV]*' 2>/dev/null || true)

          if [ -n "$last_tag" ]; then
            echo "Comparing against tag: $last_tag"
            range="${last_tag}..HEAD"
          else
            echo "No previous release tag found, showing recent commits."
            range="-10"
          fi

          commits=$(git log $range --pretty=format:"- %h: %s (%an)%n%b" | \
            awk '
              match($0, /^- [0-9a-f]+:/) {
                if (NR != 1) print ""
                print $0
                next
              }
              {
                if (length($0) > 0)
                  printf "  > %s\n", $0
                else
                  print "  >"
              }'
          )

          {
            echo 'COMMITS<<EOF'
            echo "$commits"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Generate nightly metadata
        run: |
          version_date=$(date +%Y%m%d)
          build_num=${{ github.run_number }}
          version_code="${version_date}${build_num}"

          cat > changelog.md <<EOF_CHANGELOG
          # Nightly Build Changelog

          ## Changes
          ${{ steps.commits.outputs.COMMITS }}

          Built from commit: ${{ github.sha }}
          EOF_CHANGELOG

          base_version=$(grep '^version=' "${{ env.MODULE_PROP }}" | cut -d= -f2- | sed 's/ \[.*\]//')

          cat > update-nightly-colrv1.json <<EOF_COLR
          {
              "version": "${base_version}.${version_date}.${build_num} [${GITHUB_SHA:0:7}-Nightly-COLRv1]",
              "versionCode": ${version_code},
              "zipUrl": "https://github.com/Losketch/UnicodeFontSet-magisk-module/releases/download/nightly/UnicodeFontSet-COLRv1-module.zip",
              "changelog": "https://github.com/Losketch/UnicodeFontSet-magisk-module/releases/download/nightly/changelog.md"
          }
          EOF_COLR

          cat > update-nightly-cbdt.json <<EOF_CBDT
          {
              "version": "${base_version}.${version_date}.${build_num} [${GITHUB_SHA:0:7}-Nightly-CBDT]",
              "versionCode": ${version_code},
              "zipUrl": "https://github.com/Losketch/UnicodeFontSet-magisk-module/releases/download/nightly/UnicodeFontSet-CBDT-module.zip",
              "changelog": "https://github.com/Losketch/UnicodeFontSet-magisk-module/releases/download/nightly/changelog.md"
          }
          EOF_CBDT

      - name: Delete existing nightly release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete nightly --yes -R "${{ github.repository }}" || true
          git push --delete origin nightly || true

      - name: Generate timestamp
        id: timestamp
        run: echo "timestamp=$(date +'%Y-%m-%d %H:%M UTC')" >> "$GITHUB_OUTPUT"

      - name: Create Nightly Release
        uses: softprops/action-gh-release@v3.0.2
        with:
          tag_name: nightly
          name: Nightly Build ${{ steps.timestamp.outputs.timestamp }}
          body: |
            ## Variants
            - **COLRv1**
              - Format: Vector
              - Features: Lossless scaling, supports any resolution
              - Compatibility: Android 13 (API >= 33) (requires built-in COLRv1 renderer)
              - Size: Typically smaller than bitmap

            - **CBDT**
              - Format: Bitmap
              - Features: Traditional NotoColorEmoji.ttf, ensures compatibility on older devices
              - Compatibility: Android 4.4 (API >= 19)
              - Drawback: May appear pixelated when scaled

            ### Key Differences
            | Feature | COLRv1 | CBDT |
            |---|---|---|
            | Data Type | Vector | Bitmap |
            | Scaling | Lossless, any resolution | May pixelate when enlarged |
            | Device Support | Android 13 (API >= 33) | Android 4.4 (API >= 19) |

            ## Commits
            ${{ steps.commits.outputs.COMMITS }}
          files: |
            ./artifacts/*.zip
            update-nightly-colrv1.json
            update-nightly-cbdt.json
            changelog.md
          prerelease: true
          make_latest: false
