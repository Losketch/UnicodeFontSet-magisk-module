name: Build & Release UnicodeFontSet Module

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MODULE_DIR: module
  MODULE_BIN_DIR: module/bin
  FONT_DIR: module/system/fonts
  UPDATE_BIN: module/META-INF/com/google/android/update-binary
  BUILD_DIR: build
  CLEANER_DIR: tools/font-cmap-cleaner
  RUST_VERSION: 1.97.1
  CARGO_NDK_VERSION: 4.1.2
  UPX_VERSION: 5.1.1
  NDK_VERSION: 29.0.14206865
  MAGISK_INSTALLER_COMMIT: ede844bdaa4d673617c0f14a991a79542c95967c

jobs:
  prepare:
    name: Release metadata
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.meta.outputs.matrix }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      release_name: ${{ steps.meta.outputs.release_name }}
      unicode_data_url: ${{ steps.meta.outputs.unicode_data_url }}
      unicode_label: ${{ steps.meta.outputs.unicode_label }}
    steps:
      - uses: actions/checkout@v7.0.1
      - id: meta
        shell: bash
        run: |
          echo "matrix=$(python3 tools/python/release_metadata.py matrix)" >> "$GITHUB_OUTPUT"
          echo "prerelease=$(python3 tools/python/release_metadata.py info --field prerelease)" >> "$GITHUB_OUTPUT"
          echo "release_name=$(python3 tools/python/release_metadata.py info --field release_name)" >> "$GITHUB_OUTPUT"
          echo "unicode_data_url=$(python3 tools/python/release_metadata.py info --field unicode_data_url)" >> "$GITHUB_OUTPUT"
          echo "unicode_label=$(python3 tools/python/release_metadata.py info --field unicode_label)" >> "$GITHUB_OUTPUT"
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: python3 tools/python/release_metadata.py validate-tag "${{ github.ref_name }}"

  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --all-targets --locked
      - run: cargo test --workspace --all-targets --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Shell syntax and runtime tests
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' script; do bash -n "$script"; done < <(find module tests/shell -type f -name '*.sh' -print0)
          for test_script in tests/shell/*_test.sh; do bash "$test_script"; done
          if command -v busybox >/dev/null 2>&1; then
            for test_script in tests/shell/*_test.sh; do busybox ash "$test_script"; done
          fi
      - name: Python static checks
        run: |
          python3 -m compileall -q tools/python
          python3 tools/python/validate_repository.py
          python3 -m unittest discover -s tests/python -p 'test_*.py'

  build:
    name: Build — ${{ matrix.variant.label }}
    needs: [prepare, quality]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Create build directories
        run: mkdir -p "${{ env.MODULE_BIN_DIR }}" "${{ env.BUILD_DIR }}" "$(dirname "${{ env.UPDATE_BIN }}")"

      - name: Prepare current upstream font snapshot
        run: |
          python3 tools/python/prepare_fonts.py \
            --variant "${{ matrix.variant.name }}" \
            --font-dir "${{ env.FONT_DIR }}" \
            --licenses-output "${{ env.MODULE_DIR }}/META-INF/licenses"

      - name: Download Magisk installer
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            "https://raw.githubusercontent.com/topjohnwu/Magisk/${{ env.MAGISK_INSTALLER_COMMIT }}/scripts/module_installer.sh" \
            -o "${{ env.UPDATE_BIN }}"
          chmod 755 "${{ env.UPDATE_BIN }}"

      - name: Generate module metadata
        shell: bash
        run: |
          channel=build
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then channel=release; fi
          if [[ "${GITHUB_EVENT_NAME}" == push && "${GITHUB_REF}" == refs/heads/main ]]; then channel=nightly; fi
          python3 tools/python/release_metadata.py module-prop \
            --variant "${{ matrix.variant.name }}" \
            --channel "$channel" \
            --run-number "${{ github.run_number }}" \
            --sha "${{ github.sha }}" \
            --output "${{ env.MODULE_DIR }}/module.prop"

      - uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - run: cargo install cargo-ndk --version "${{ env.CARGO_NDK_VERSION }}" --locked
      - uses: android-actions/setup-android@v4.0.1
      - uses: actions/cache@v6.1.0
        with:
          path: ${{ env.ANDROID_SDK_ROOT }}/ndk/${{ env.NDK_VERSION }}
          key: android-ndk-${{ env.NDK_VERSION }}
      - name: Install Android NDK
        run: |
          sdkmanager "ndk;${{ env.NDK_VERSION }}" "build-tools;34.0.0" "platforms;android-34"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/${{ env.NDK_VERSION }}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/${{ env.NDK_VERSION }}" >> "$GITHUB_ENV"
      - run: rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android

      - name: Install UPX
        run: |
          if ! command -v upx >/dev/null; then
            cd /tmp
            curl --fail --silent --show-error --location --retry 3 \
              "https://github.com/upx/upx/releases/download/v${{ env.UPX_VERSION }}/upx-${{ env.UPX_VERSION }}-amd64_linux.tar.xz" -o upx.tar.xz
            tar -xf upx.tar.xz
            sudo install -m 0755 "upx-${{ env.UPX_VERSION }}-amd64_linux/upx" /usr/local/bin/upx
          fi

      - name: Build font-cmap-tool for Android
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target"
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86 -t x86_64 build \
            --manifest-path "${{ env.CLEANER_DIR }}/Cargo.toml" --package font-cmap-tool --release --locked
          declare -A targets=(
            [aarch64-linux-android]=arm64-v8a
            [armv7-linux-androideabi]=armeabi-v7a
            [i686-linux-android]=x86
            [x86_64-linux-android]=x86_64
          )
          for target in "${!targets[@]}"; do
            bin="$CARGO_TARGET_DIR/$target/release/font-cmap-tool"
            out="${{ env.MODULE_BIN_DIR }}/font-cmap-tool-${targets[$target]}"
            test -x "$bin"
            upx --best --lzma "$bin" || true
            install -m 0755 "$bin" "$out"
          done

      - name: Unicode coverage report (warning only)
        shell: bash
        run: |
          report="${{ env.BUILD_DIR }}/unicode-coverage-${{ matrix.variant.name }}.txt"
          ucd="${RUNNER_TEMP}/UnicodeData.txt"
          if python3 -m pip install --disable-pip-version-check -q fonttools \
             && curl --fail --silent --show-error --location --retry 3 "${{ needs.prepare.outputs.unicode_data_url }}" -o "$ucd"; then
            python3 tools/python/check_fonts_unicode.py "$ucd" "${{ env.FONT_DIR }}"/* \
              --font-policy module/config/font-policy.tsv \
              --warn-only --github-warning --lang en | tee "$report"
          else
            echo "::warning title=Unicode coverage::Coverage report could not be generated" | tee "$report"
          fi

      - name: Copy runtime documentation
        run: |
          cp LICENSE "${{ env.MODULE_DIR }}/LICENSE"
          cp "${{ env.CLEANER_DIR }}/LICENSE" "${{ env.MODULE_DIR }}/META-INF/licenses/LICENSE-font-cmap-tool"
          cp README.md "${{ env.MODULE_DIR }}/README.md"
          cp README.en.md "${{ env.MODULE_DIR }}/README.en.md"

      - name: Validate built module assets
        run: python3 tools/python/validate_module.py --module "${{ env.MODULE_DIR }}"

      - name: Package module and reports
        run: |
          set -euo pipefail
          (cd "${{ env.MODULE_DIR }}" && zip -9 -r "../${{ matrix.variant.artifact }}" .)
          unzip -t "${{ matrix.variant.artifact }}"
          mv "${{ matrix.variant.artifact }}" "${{ env.BUILD_DIR }}/"
          cp "${{ env.MODULE_DIR }}/META-INF/licenses/font-manifest.tsv" \
             "${{ env.BUILD_DIR }}/font-manifest-${{ matrix.variant.name }}.tsv"

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: module-artifacts-${{ matrix.variant.name }}
          path: ${{ env.BUILD_DIR }}
          if-no-files-found: error

  release:
    name: Versioned Release
    needs: [prepare, build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.1
        with:
          name: module-artifacts-colrv1
          path: ./artifacts
      - uses: actions/download-artifact@v8.0.1
        with:
          name: module-artifacts-cbdt
          path: ./artifacts
      - name: Require reviewed font licenses before publishing
        shell: bash
        run: |
          if grep -R -n -F 'REVIEW_REQUIRED' artifacts/font-manifest-*.tsv; then
            echo '::error title=Font licensing::Public releases require reviewed font licenses'
            exit 1
          fi
      - name: Generate Release metadata assets
        run: |
          cp extra/changelog.md artifacts/changelog.md
          python3 tools/python/release_metadata.py update-json --variant colrv1 --channel release --tag "${{ github.ref_name }}" --output artifacts/update-colrv1.json
          python3 tools/python/release_metadata.py update-json --variant cbdt --channel release --tag "${{ github.ref_name }}" --output artifacts/update-cbdt.json
      - uses: softprops/action-gh-release@v3.0.2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ needs.prepare.outputs.release_name }}
          body_path: extra/changelog.md
          files: ./artifacts/*
          draft: false
          prerelease: ${{ fromJSON(needs.prepare.outputs.prerelease) }}
          make_latest: ${{ !fromJSON(needs.prepare.outputs.prerelease) }}

  nightly:
    name: Nightly Release
    needs: [prepare, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/download-artifact@v8.0.1
        with:
          name: module-artifacts-colrv1
          path: ./artifacts
      - uses: actions/download-artifact@v8.0.1
        with:
          name: module-artifacts-cbdt
          path: ./artifacts
      - name: Require reviewed font licenses before publishing
        shell: bash
        run: |
          if grep -R -n -F 'REVIEW_REQUIRED' artifacts/font-manifest-*.tsv; then
            echo '::error title=Font licensing::Public releases require reviewed font licenses'
            exit 1
          fi
      - name: Generate nightly changelog
        id: commits
        shell: bash
        run: |
          last_tag=$(git describe --tags --abbrev=0 --exclude='*nightly*' --match='v*' 2>/dev/null || true)
          if [ -n "$last_tag" ]; then range="${last_tag}..HEAD"; else range="-10"; fi
          git log $range --pretty=format:'- %h: %s (%an)' > artifacts/changelog.md
      - name: Generate nightly update metadata
        run: |
          python3 tools/python/release_metadata.py update-json --variant colrv1 --channel nightly --run-number "${{ github.run_number }}" --sha "${{ github.sha }}" --output artifacts/update-nightly-colrv1.json
          python3 tools/python/release_metadata.py update-json --variant cbdt --channel nightly --run-number "${{ github.run_number }}" --sha "${{ github.sha }}" --output artifacts/update-nightly-cbdt.json
      - name: Replace rolling nightly release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete nightly --yes -R "${{ github.repository }}" || true
          git push --delete origin nightly || true
      - uses: softprops/action-gh-release@v3.0.2
        with:
          tag_name: nightly
          name: Nightly Build
          body_path: artifacts/changelog.md
          files: ./artifacts/*
          prerelease: true
          make_latest: false
