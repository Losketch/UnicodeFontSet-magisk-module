# UnicodeFontSet shared discovery configuration.
# Keep this file POSIX-shell-sourceable: KEY="space separated values".
# Rust embeds and parses the same file at compile time.

# familyset-style XML files used both for system fallback-baseline parsing and UFS injection.
# Product fonts_customization.xml is intentionally excluded: it mainly defines named/optional
# families and locale customizations, not a global default fallback list.
FONT_XML_FAMILYSET_FILES="fonts.xml fonts_base.xml fonts_fallback.xml fonts_inter.xml fonts_slate.xml fonts_ule.xml font_fallback.xml fonts_flyme.xml flyme_fallback.xml flyme_font_fallback.xml"

# Module-relative overlay locations used by Shell sibling patch/rebase.
FONT_XML_MODULE_SUBDIRS="system/etc system/product/etc system/system_ext/etc"
FONT_BINARY_MODULE_SUBDIRS="system/fonts"

# Absolute XML locations used to derive the cleaner's default/global fallback baseline.
# /product/etc/fonts_customization.xml is not part of this list by design.
FONT_XML_BASELINE_DIRS="/system/etc /system/system_ext/etc /system_ext/etc /vendor/etc"

# Font roots that may contribute to the default/global fallback baseline.
# Product fonts are intentionally excluded: on modern Android they are commonly registered as
# named/optional fonts and should not suppress UFS fallback glyphs unless a ROM explicitly moves
# them into its real fallback configuration.
SYSTEM_FONT_BASELINE_DIRS="/system/fonts /system_ext/fonts /system/system_ext/fonts /vendor/fonts"

# Wider roots used only by the `find` diagnostic command. Product fonts remain discoverable here.
SYSTEM_FONT_SEARCH_DIRS="/system/fonts /product/fonts /system/product/fonts /system_ext/fonts /system/system_ext/fonts /vendor/fonts"

# Android updatable-font subsystem.
UPDATABLE_SYSTEM_FONT_DIR="/data/fonts/files"
UPDATABLE_CONFIG_XML="/data/fonts/config/config.xml"
